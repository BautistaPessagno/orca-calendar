<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Orca's theme (--orca-*) is the canvas; Google Calendar's schedule view is the layout:
         a day gutter with the date, colour-coded events, a blue "today" circle, a red now line. */
      :root {
        --bg: var(--orca-background, #ffffff);
        --fg: var(--orca-foreground, #1f1f1f);
        --muted: var(--orca-muted-foreground, #5f6368);
        --hover: var(--orca-accent, rgba(60, 64, 67, 0.08));
        --line: var(--orca-border, rgba(60, 64, 67, 0.16));
        --input: var(--orca-input, var(--line));
        --ring: var(--orca-ring, #1a73e8);
        --card: var(--orca-card, var(--bg));
        --popover: var(--orca-popover, var(--bg));
        --radius: var(--orca-radius, 8px);
        /* Google Calendar's own accents. */
        --today: #1a73e8;
        --on-today: #ffffff;
        --now: #ea4335;
        --join: #1a73e8;
        --on-join: #ffffff;
        --ok: #188038;
        --no: #d93025;
        --maybe: #5f6368;
        --warn-bg: #fef7e0;
        --warn-fg: #8a5300;
        --gutter: 46px;
      }
      html.dark {
        --today: #8ab4f8;
        --on-today: #062e6f;
        --now: #f28b82;
        --join: #8ab4f8;
        --on-join: #062e6f;
        --ok: #81c995;
        --no: #f28b82;
        --maybe: #9aa0a6;
        --warn-bg: rgba(253, 214, 99, 0.12);
        --warn-fg: #fdd663;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; overflow-x: hidden; }
      body {
        font: 13px/1.38 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; cursor: pointer; }
      input, select { font: inherit; color: inherit; }
      svg { display: block; flex: none; }
      :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-radius: 4px; }
      .tabular { font-variant-numeric: tabular-nums; }

      /* ---------- header ---------- */
      .top {
        position: sticky; top: 0; z-index: 3;
        display: flex; align-items: center; gap: 4px;
        padding: 10px 8px 8px 14px;
        background: var(--bg);
      }
      .top h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.1px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .icon-btn {
        width: 30px; height: 30px; border: 0; border-radius: 50%;
        background: none; color: var(--muted);
        display: grid; place-items: center;
      }
      .icon-btn:hover { background: var(--hover); color: var(--fg); }
      .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; } }

      /* ---------- the "up next" card ---------- */
      .next {
        margin: 2px 10px 10px; padding: 10px 12px;
        border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px);
        background: var(--card);
        display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; column-gap: 10px; align-items: center;
      }
      .next .bar { align-self: stretch; border-radius: 2px; }
      .next .label { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
      .next .label.now { color: var(--now); }
      .next .label.soon { color: var(--warn-fg); }
      .next .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .next .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .join {
        display: inline-flex; align-items: center; gap: 6px;
        height: 30px; padding: 0 14px 0 11px; border: 0; border-radius: 15px;
        background: var(--join); color: var(--on-join);
        font-weight: 500; font-size: 12.5px; white-space: nowrap;
      }
      .join:hover { filter: brightness(1.08); box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
      .join.small { height: 24px; padding: 0 10px 0 8px; font-size: 12px; border-radius: 12px; }

      /* ---------- banners ---------- */
      .banner { margin: 0 10px 8px; padding: 8px 10px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn-fg); font-size: 12px; }

      /* ---------- agenda ---------- */
      .day { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); padding: 6px 8px 10px 6px; border-top: 1px solid var(--line); }
      .day:first-child { border-top: 0; }
      .date { display: grid; justify-items: center; align-content: start; gap: 1px; padding-top: 4px; }
      .date .dow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px; color: var(--muted); text-transform: uppercase; }
      .date .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 400; }
      .day.today .dow { color: var(--today); }
      .day.today .num { background: var(--today); color: var(--on-today); font-weight: 500; }
      .items { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; padding-top: 2px; }
      .empty-day { color: var(--muted); font-size: 12.5px; padding: 9px 6px; }

      .chip {
        display: block; width: 100%; text-align: left;
        border: 0; border-radius: 4px; padding: 3px 8px; margin-bottom: 2px;
        color: #fff; font-size: 12px; font-weight: 500;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .event {
        position: relative;
        display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 8px; align-items: start;
        width: 100%; text-align: left; border: 0; background: none;
        padding: 6px 6px 6px 6px; border-radius: var(--radius);
      }
      .event:hover { background: var(--hover); }
      .event .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--c); }
      .event .what { min-width: 0; border: 0; padding: 0; margin: 0; background: none; color: inherit; font: inherit; text-align: left; }
      .event .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .event .when { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .event .side { display: flex; align-items: center; gap: 6px; padding-top: 1px; }
      .event.current { background: color-mix(in srgb, var(--c) 14%, transparent); }
      .event.current:hover { background: color-mix(in srgb, var(--c) 20%, transparent); }
      .event.past .title, .event.past .when { opacity: 0.55; }
      .event.past .dot { opacity: 0.5; }
      /* Google's look for an unanswered invitation: the dot hollow, in the calendar colour. */
      .event.needsAction .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
      .event.tentative .dot { background: repeating-linear-gradient(135deg, var(--c) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1.5px var(--c); }
      .event.declined .title { text-decoration: line-through; color: var(--muted); }
      .event.declined .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
      .event.free .title::after { content: ' · free'; font-weight: 400; color: var(--muted); }
      .badge { font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--now); }
      .resp { width: 16px; height: 16px; color: var(--muted); }

      .now-line { position: relative; height: 12px; margin: -1px 0 -1px; }
      .now-line::before { content: ''; position: absolute; left: 0; right: 0; top: 5.5px; height: 2px; background: var(--now); }
      .now-line::after { content: ''; position: absolute; left: -1px; top: 1.5px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
      .now-line span { position: absolute; right: 2px; top: -6px; font-size: 10.5px; font-weight: 600; color: var(--now); background: var(--bg); padding: 0 4px; }

      .gap { display: flex; align-items: center; gap: 8px; padding: 3px 6px; color: var(--muted); font-size: 12px; }
      .gap::before, .gap::after { content: ''; flex: 1 0 12px; border-top: 1px dashed var(--line); }
      .gap span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

      /* ---------- details ---------- */
      .details { margin: 0 0 6px 18px; padding: 4px 6px 8px 0; display: grid; gap: 8px; font-size: 12.5px; }
      .row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; }
      .row > svg { color: var(--muted); margin-top: 1px; }
      .row .sub { color: var(--muted); }
      .row a, .linkish { color: var(--today); text-decoration: none; background: none; border: 0; padding: 0; text-align: left; }
      .row a:hover, .linkish:hover { text-decoration: underline; }
      .people { display: grid; gap: 4px; }
      .person { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .avatar { position: relative; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; color: #fff; flex: none; }
      .avatar i { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); }
      .avatar i svg { width: 10px; height: 10px; }
      .person .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .person .role { color: var(--muted); font-size: 11.5px; }
      .notes { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); max-height: 9.5em; overflow: auto; }
      .tag { display: inline-block; font-size: 11px; color: var(--muted); }

      .rsvp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .rsvp .q { color: var(--muted); margin-right: 2px; }
      .rsvp button {
        height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid var(--line);
        background: none; color: var(--fg); font-size: 12px; font-weight: 500;
        display: inline-flex; align-items: center; gap: 4px;
      }
      .rsvp button:hover { background: var(--hover); }
      .rsvp button[aria-pressed='true'] { background: color-mix(in srgb, var(--today) 16%, transparent); border-color: transparent; color: var(--today); }
      .rsvp button[disabled] { opacity: 0.55; cursor: default; }

      /* ---------- sheets: setup, messages, calendars ---------- */
      .sheet { padding: 14px 16px 20px; display: grid; gap: 12px; }
      .sheet h2 { margin: 0; font-size: 16px; font-weight: 500; }
      .sheet p { margin: 0; color: var(--muted); }
      .hero { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 28px 18px 12px; }
      .hero svg { color: var(--today); }
      .steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--fg); font-size: 12.5px; }
      .steps li::marker { color: var(--muted); }
      .steps code, .mono { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
      details.help summary { cursor: pointer; color: var(--today); font-size: 12.5px; }
      details.help[open] summary { margin-bottom: 8px; }
      label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
      label.field input { height: 32px; padding: 0 10px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--bg); color: var(--fg); min-width: 0; }
      label.field input:focus { outline: 2px solid var(--ring); outline-offset: -1px; }
      .btn {
        height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--line);
        background: var(--bg); color: var(--today); font-weight: 500;
      }
      .btn:hover { background: var(--hover); }
      .btn.primary { background: var(--join); color: var(--on-join); border-color: transparent; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn[disabled] { opacity: 0.5; cursor: default; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .error { color: var(--no); font-size: 12.5px; }
      .alt { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }

      .section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 17px; overflow: hidden; }
      .seg button { flex: 1; height: 30px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button[aria-pressed='true'] { background: color-mix(in srgb, var(--today) 16%, transparent); color: var(--today); }
      .cal { display: flex; align-items: center; gap: 10px; padding: 5px 2px; border-radius: 6px; cursor: pointer; }
      .cal:hover { background: var(--hover); }
      .cal input { position: absolute; opacity: 0; pointer-events: none; }
      .box { width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--c); display: grid; place-items: center; flex: none; }
      .cal input:checked + .box { background: var(--c); }
      .cal input:focus-visible + .box { outline: 2px solid var(--ring); outline-offset: 2px; }
      .box svg { color: #fff; opacity: 0; }
      .cal input:checked + .box svg { opacity: 1; }
      .cal .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      select.days { height: 30px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--bg); padding: 0 8px; }

      /* ---------- loading ---------- */
      .skeleton { padding: 10px 14px; display: grid; gap: 14px; }
      .sk { height: 12px; border-radius: 6px; background: var(--hover); }
      .sk.w60 { width: 60%; } .sk.w40 { width: 40%; } .sk.w80 { width: 80%; }
      .foot { padding: 10px 14px 18px; color: var(--muted); font-size: 11.5px; display: flex; gap: 6px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header class="top">
      <h1 id="month">Calendar</h1>
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh"></button>
      <button class="icon-btn" id="settings" title="Calendars and source" aria-label="Calendars and source"></button>
    </header>
    <main id="main"></main>

    <script type="module">
      import { buildAgenda, meetingState } from '../shared/agenda.mjs'
      import { clip, formatDuration, formatTime, where } from '../shared/format.mjs'
      import { openable } from '../shared/links.mjs'

      const $ = (id) => document.getElementById(id)
      const main = $('main')
      const locale = (globalThis.orca && orca.locale) || undefined

      // ---------- icons (drawn here, 24px grid) ----------
      const ICONS = {
        refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
        calendars: '<rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M7.5 13.5h3M13.5 13.5h3M7.5 16.5h3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
        video: '<rect x="2.5" y="6" width="13" height="12" rx="2.5" fill="currentColor"/><path d="M16.5 10.5 21.5 7v10l-5-3.5z" fill="currentColor"/>',
        pin: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/>',
        people: '<circle cx="9" cy="8.5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.5a3 3 0 0 1 0 6M17.5 14.3c1.8.6 3 2.2 3.5 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        clock: '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        notes: '<path d="M5 6h14M5 10h14M5 14h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        door: '<path d="M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21M3.5 21h17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14.5" cy="12.5" r="1.2" fill="currentColor"/>',
        repeat: '<path d="M17 3.5 20 6.5l-3 3M4 11V9.5a3 3 0 0 1 3-3h13M7 20.5 4 17.5l3-3M20 13v1.5a3 3 0 0 1-3 3H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
        external: '<path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
        check: '<path d="M5 12.5 10 17.5 19.5 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
        cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
        question: '<path d="M9 9.2a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.8v.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18.3" r="1.5" fill="currentColor"/>',
        sheet: '<rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="15.5" r="2.2" fill="currentColor"/>',
        lock: '<rect x="5" y="10.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>'
      }
      const icon = (name, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`

      $('refresh').innerHTML = icon('refresh')
      $('settings').innerHTML = icon('calendars')

      // ---------- small helpers ----------
      const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
      const COLOR = /^#[0-9a-f]{6}$/i
      const safeColor = (value) => (COLOR.test(value ?? '') ? value : '#039be5')
      const fmt = { locale }
      const time = (ms) => formatTime(ms, fmt)
      const dayFmt = (options) => new Intl.DateTimeFormat(locale, options)
      const parseDate = (date) => {
        const [y, m, d] = date.split('-').map(Number)
        return new Date(y, m - 1, d)
      }

      // Needs the click itself: call it straight from a click handler, never after an await.
      function openUrl(url) {
        if (!url) return
        Promise.resolve(orca.shell.openExternal(url)).catch(() => {})
      }

      function request(name, input) {
        return input === undefined ? orca.plugin.request(name) : orca.plugin.request(name, input)
      }

      // ---------- state ----------
      let snap = null
      let open = new Set() // expanded event ids
      let view = 'agenda' // 'agenda' | 'calendars'
      let auth = null // auth.info
      let login = { url: null, error: null, busy: false, polling: null }
      let busy = false
      let answering = null // id of the event whose answer is being sent
      let answerError = null // { id, message }

      async function load(refresh = false) {
        busy = true
        $('refresh').classList.add('spin')
        try {
          snap = await request('agenda.get', refresh ? { refresh: true } : undefined)
          if (snap && (snap.backend === 'google' || snap.status === 'needs-setup' || snap.status === 'unauthenticated')) auth = await request('auth.info').catch(() => auth)
        } catch (error) {
          snap = { status: 'error', message: error?.message || 'Calendar could not be read.', events: [], calendars: [], days: 3 }
        } finally {
          busy = false
          $('refresh').classList.remove('spin')
        }
        render()
      }

      async function act(name, input) {
        try {
          snap = await request(name, input)
        } catch (error) {
          snap = { ...(snap || {}), status: 'error', message: error?.message || 'That didn’t work.' }
        }
        render()
      }

      // ---------- rendering ----------
      function render() {
        const now = Date.now()
        $('month').textContent = view === 'calendars' ? 'Calendars' : dayFmt({ month: 'long', year: 'numeric' }).format(new Date(now))
        if (!snap) return renderLoading()
        if (view === 'calendars') return renderCalendars()
        const blocking = { 'needs-setup': renderConnect, unauthenticated: renderConnect, 'not-asked': renderMacAccess, 'no-access': renderMessage, unsupported: renderMessage }
        if (blocking[snap.status]) return blocking[snap.status]()
        if (snap.status !== 'ready' && !(snap.events || []).length) return renderMessage()
        renderAgenda(now)
      }

      function renderLoading() {
        main.innerHTML = `<div class="skeleton" aria-label="Loading">${'<div class="sk w60"></div><div class="sk w80"></div><div class="sk w40"></div>'.repeat(3)}</div>`
      }

      function responseOf(event) {
        return event.self?.response ?? null
      }

      function renderAgenda(now) {
        const agenda = buildAgenda(snap.events || [], { now, days: snap.days || 3, showDeclined: snap.showDeclined })
        const html = []
        if (snap.status !== 'ready' && snap.message) html.push(`<div class="banner" role="status">${esc(snap.message)}</div>`)
        html.push(renderNext(now))
        html.push('<div class="agenda">')
        for (const day of agenda.days) html.push(renderDay(day, now, agenda.current))
        html.push('</div>')
        html.push(renderFoot())
        main.innerHTML = html.join('')
      }

      // The card at the top: what runs now, else what comes next today.
      function renderNext(now) {
        const { current, next } = meetingState(snap.events || [], now)
        const soonNext = next && next.start - now <= 5 * 60_000
        const event = soonNext ? next : current || next
        if (!event || (!current && event.start - now > 12 * 3600_000)) return ''
        const running = event === current && !soonNext
        const label = running ? `Now · ends in ${formatDuration(event.end - now)}` : `${event.start - now <= 5 * 60_000 ? 'Starting' : 'Next'} in ${formatDuration(event.start - now)}`
        const cls = running ? 'now' : event.start - now <= 5 * 60_000 ? 'soon' : ''
        const meta = [`${time(event.start)} – ${time(event.end)}`, where(event)].filter(Boolean).join(' · ')
        const join = joinButton(event, false)
        return `<section class="next" aria-label="${running ? 'Current meeting' : 'Next meeting'}">
          <span class="bar" style="background:${safeColor(event.color)}"></span>
          <div style="min-width:0"><div class="label ${cls} tabular">${esc(label)}</div><div class="title">${esc(event.title)}</div><div class="meta tabular">${esc(meta)}</div></div>
          ${join}
        </section>`
      }

      function joinButton(event, small) {
        if (!openable(event.conference)) return ''
        return `<button class="join${small ? ' small' : ''}" data-join="${esc(event.id)}" title="Join ${esc(event.conference.label)}">${icon('video', small ? 14 : 16)}Join</button>`
      }

      function renderDay(day, now, current) {
        const date = parseDate(day.date)
        const dow = dayFmt({ weekday: 'short' }).format(date)
        const html = [`<section class="day${day.today ? ' today' : ''}" aria-label="${esc(dayFmt({ weekday: 'long', day: 'numeric', month: 'long' }).format(date))}">`]
        html.push(`<div class="date"><span class="dow">${esc(dow)}</span><span class="num tabular">${date.getDate()}</span></div><div class="items">`)
        for (const event of day.allDay) {
          html.push(`<button class="chip" style="background:${safeColor(event.color)}" data-open="${esc(event.id)}" title="${esc(event.title)}">${esc(event.title)}</button>`)
          if (open.has(event.id)) html.push(renderDetails(event))
        }
        const timed = day.items.filter((i) => i.type === 'event')
        if (!timed.length && !day.allDay.length) html.push(`<div class="empty-day">${day.today ? 'Nothing else today' : 'Nothing scheduled'}</div>`)
        for (const item of day.items) {
          if (item.type === 'now') {
            if (timed.length) html.push(`<div class="now-line" role="presentation"><span class="tabular">${esc(time(item.at))}</span></div>`)
          } else if (item.type === 'gap') {
            html.push(`<div class="gap tabular" title="Free ${esc(time(item.start))} – ${esc(time(item.end))}"><span>${esc(formatDuration(item.end - item.start))} free until ${esc(time(item.end))}</span></div>`)
          } else {
            html.push(renderEvent(item, now, current))
            if (open.has(item.event.id)) html.push(renderDetails(item.event))
          }
        }
        html.push('</div></section>')
        return html.join('')
      }

      const RESPONSE_ICON = { accepted: ['check', 'var(--ok)', 'Going'], declined: ['cross', 'var(--no)', 'Not going'], tentative: ['question', 'var(--maybe)', 'Maybe'], needsAction: ['question', 'var(--muted)', 'Not answered'] }

      function renderEvent(item, now, current) {
        const { event } = item
        const response = responseOf(event)
        const classes = ['event']
        if (current.includes(event.id)) classes.push('current')
        else if (event.end <= now) classes.push('past')
        if (response && response !== 'accepted') classes.push(response)
        if (event.busy === false) classes.push('free')
        const start = item.continued ? '…' : time(event.start)
        const end = item.continues ? '…' : time(event.end)
        const place = where(event)
        const guests = (event.attendees || []).length
        const when = [`${start} – ${end}`, place, guests > 1 ? `${guests} guests` : ''].filter(Boolean).join(' · ')
        const live = event.start - now <= 10 * 60_000 && event.end > now
        const side = []
        if (current.includes(event.id)) side.push('<span class="badge">Now</span>')
        if (live) side.push(joinButton(event, true))
        else if (response === 'needsAction') side.push(`<span class="tag">Invited</span>`)
        return `<div class="${classes.join(' ')}" style="--c:${safeColor(event.color)}">
          <span class="dot"></span>
          <button class="what" data-open="${esc(event.id)}" aria-expanded="${open.has(event.id)}">
            <div class="title">${esc(event.title)}</div><div class="when tabular">${esc(when)}</div>
          </button>
          <div class="side">${side.join('')}</div>
        </div>`
      }

      function initials(name) {
        const parts = String(name || '?').replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean)
        return ((parts[0]?.[0] ?? '?') + (parts[1]?.[0] ?? '')).toUpperCase()
      }
      // A stable colour per person, from Google's palette.
      const AVATAR = ['#7986cb', '#33b679', '#8e24aa', '#e67c73', '#f4511e', '#039be5', '#616161', '#3f51b5', '#0b8043', '#d50000']
      const avatarColor = (key) => AVATAR[[...String(key)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % AVATAR.length]

      function renderDetails(event) {
        const rows = []
        const dateLine = event.allDay
          ? `${dayFmt({ weekday: 'long', day: 'numeric', month: 'long' }).format(parseDate(event.start))}${event.end > event.start ? '' : ''}`
          : `${dayFmt({ weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(event.start))} · ${time(event.start)} – ${time(event.end)}`
        const zone = Intl.DateTimeFormat().resolvedOptions().timeZone
        const other = !event.allDay && event.timeZone && event.timeZone !== zone ? `<div class="sub tabular">${esc(formatTime(event.start, { locale, timeZone: event.timeZone }))} – ${esc(formatTime(event.end, { locale, timeZone: event.timeZone }))} ${esc(event.timeZone.replace(/_/g, ' '))}</div>` : ''
        rows.push(`<div class="row">${icon('clock', 16)}<div class="tabular">${esc(dateLine)}${event.recurring ? ` <span class="sub">· repeats</span>` : ''}${other}</div></div>`)
        if (openable(event.conference)) {
          rows.push(`<div class="row">${icon('video', 16)}<div style="display:grid;gap:6px;justify-items:start">${joinButton(event, false).replace('>Join<', `>Join ${esc(event.conference.label)}<`)}<span class="sub" style="overflow-wrap:anywhere">${esc(clip(event.conference.url.replace(/^https:\/\//, ''), 60))}</span></div></div>`)
        }
        if (event.location) rows.push(`<div class="row">${icon('pin', 16)}<div style="overflow-wrap:anywhere">${esc(event.location)}</div></div>`)
        if (event.room) rows.push(`<div class="row">${icon('door', 16)}<div>${esc(event.room)}</div></div>`)
        const people = event.attendees || []
        if (people.length) {
          const counts = people.reduce((acc, p) => ((acc[p.response] = (acc[p.response] || 0) + 1), acc), {})
          const summary = [counts.accepted && `${counts.accepted} yes`, counts.tentative && `${counts.tentative} maybe`, counts.declined && `${counts.declined} no`, counts.needsAction && `${counts.needsAction} awaiting`].filter(Boolean).join(', ')
          const list = people.slice(0, 12).map((p) => {
            const [ic, color, title] = RESPONSE_ICON[p.response] ?? RESPONSE_ICON.needsAction
            const role = [p.self ? 'you' : '', p.organizer ? 'organizer' : '', p.optional ? 'optional' : ''].filter(Boolean).join(', ')
            return `<div class="person"><span class="avatar" style="background:${avatarColor(p.email || p.name)}" title="${esc(title)}">${esc(initials(p.name))}<i style="color:${color}">${icon(ic, 10)}</i></span><span class="name">${esc(p.name)}</span>${role ? `<span class="role">${esc(role)}</span>` : ''}</div>`
          })
          const more = people.length > 12 || event.attendeesOmitted ? `<div class="sub">and ${people.length > 12 ? people.length - 12 : 'more'} others</div>` : ''
          rows.push(`<div class="row">${icon('people', 16)}<div class="people"><div class="sub">${people.length} guests · ${esc(summary)}</div>${list.join('')}${more}</div></div>`)
        }
        if (event.self?.response) rows.push(renderAnswer(event))
        if (event.description) rows.push(`<div class="row">${icon('notes', 16)}<div class="notes">${esc(event.description)}</div></div>`)
        if (event.htmlLink) rows.push(`<div class="row">${icon('external', 16)}<div><button class="linkish" data-url="${esc(event.htmlLink)}">Open in Google Calendar</button></div></div>`)
        return `<div class="details">${rows.join('')}</div>`
      }

      // "Going? Yes No Maybe", as Google Calendar asks it. Writes only on a press.
      const ANSWERS = [['accepted', 'Yes'], ['declined', 'No'], ['tentative', 'Maybe']]
      function renderAnswer(event) {
        const current = event.self.response
        const canAnswer = snap.capabilities?.rsvp && !event.organizer?.self && event.self.email !== undefined
        if (!canAnswer) {
          const [, , label] = RESPONSE_ICON[current] ?? RESPONSE_ICON.needsAction
          return `<div class="row">${icon('check', 16)}<div>Your answer: ${esc(label)}</div></div>`
        }
        if (snap.backend === 'google' && auth?.missingScopes?.length) {
          const action = login.url ? `<button class="btn primary" id="signin" style="height:28px">Sign in with Google</button>` : `<button class="linkish" id="reauth">Connect Google again to answer invitations</button>`
          return `<div class="row">${icon('check', 16)}<div style="display:grid;gap:6px;justify-items:start"><span>Your answer: ${esc((RESPONSE_ICON[current] ?? RESPONSE_ICON.needsAction)[2])}</span>${action}${login.error ? `<span class="error">${esc(login.error)}</span>` : ''}</div></div>`
        }
        const sending = answering === event.id
        const buttons = ANSWERS.map(([value, label]) => `<button data-answer="${value}" data-event="${esc(event.id)}" data-calendar="${esc(event.calendarId)}" aria-pressed="${current === value}"${sending ? ' disabled' : ''}>${current === value ? icon('check', 12) : ''}${label}</button>`).join('')
        const error = answerError?.id === event.id ? `<div class="error" role="alert">${esc(answerError.message)}</div>` : ''
        return `<div class="row">${icon('check', 16)}<div style="display:grid;gap:6px"><div class="rsvp" role="group" aria-label="Your answer"><span class="q">Going?</span>${buttons}</div>${error}</div></div>`
      }

      async function answer(eventId, calendarId, response) {
        answering = eventId
        answerError = null
        render()
        try {
          snap = await request('event.respond', { id: eventId, calendarId, response })
        } catch (error) {
          answerError = { id: eventId, message: error?.message || 'Your answer didn’t go through.' }
        } finally {
          answering = null
        }
        render()
      }

      const SOURCE = { google: 'Google Calendar', eventkit: 'Mac calendars', sample: 'Sample week' }
      function renderFoot() {
        const shown = (snap.calendars || []).filter((c) => c.shown).length
        const updated = snap.fetchedAt ? `updated ${time(snap.fetchedAt)}` : ''
        return `<footer class="foot tabular"><span>${esc(SOURCE[snap.backend] || '')}</span><span>·</span><span>${shown} of ${(snap.calendars || []).length} calendars</span>${updated ? `<span>·</span><span>${esc(updated)}</span>` : ''}</footer>`
      }

      // ---------- Google setup ----------
      function renderConnect() {
        const ended = snap.status === 'unauthenticated'
        const clientId = auth?.clientId || ''
        const mac = auth?.platform === 'darwin' || (!auth && navigator.platform.startsWith('Mac'))
        const redirect = auth?.redirectUri || 'http://127.0.0.1:43119/callback'
        // A refresh can draw this screen again while the person is typing: keep what they typed.
        const kept = { cid: $('cid')?.value, csecret: $('csecret')?.value }
        main.innerHTML = `<div class="sheet">
          <div class="hero">${icon('sheet', 40)}<h2>${ended ? 'Connect Google Calendar again' : 'Connect Google Calendar'}</h2><p>${esc(ended ? snap.message : 'See your meetings, join calls and get reminders without leaving Orca. It takes about five minutes, once.')}</p></div>
          <details class="help"${clientId ? '' : ' open'}><summary>Create your Google sign-in (once)</summary>
            <ol class="steps">
              <li>Open <button class="linkish" data-url="https://console.cloud.google.com/projectcreate">console.cloud.google.com</button> with your work account and create a project, e.g. “Orca Calendar”. Keep your company as its organization.</li>
              <li>APIs &amp; Services → Library → <b>Google Calendar API</b> → Enable.</li>
              <li>Google Auth Platform → Get started. Audience: <b>Internal</b> (your company only, no expiry). If Internal isn't offered, pick External and add yourself under Test users; you'll reconnect every 7 days.</li>
              <li>Data Access → Add scopes: <code>calendar.calendarlist.readonly</code> and <code>${auth?.rsvp === false ? 'calendar.events.readonly' : 'calendar.events'}</code>${auth?.rsvp === false ? '' : ' (lets you answer invitations; turn off “Answer invitations” in Settings for read-only)'}.</li>
              <li>Clients → Create client → Application type <b>Desktop app</b> → Create. Copy the client ID and the client secret below.</li>
            </ol>
          </details>
          <label class="field">Client ID<input id="cid" autocomplete="off" spellcheck="false" placeholder="…apps.googleusercontent.com" value="${esc(clientId)}" /></label>
          <label class="field">Client secret${auth?.hasSecret ? ' <span>(saved; paste a new one to replace it)</span>' : ''}<input id="csecret" type="password" autocomplete="off" spellcheck="false" placeholder="${auth?.hasSecret ? '••••••••' : 'GOCSPX-…'}" /></label>
          <div class="actions">
            ${login.url ? `<button class="btn primary" id="signin">Sign in with Google</button><span class="sub" style="color:var(--muted);font-size:12px">Opens your browser</span>` : `<button class="btn primary" id="continue"${login.busy ? ' disabled' : ''}>Continue</button>`}
          </div>
          ${login.error ? `<div class="error" role="alert">${esc(login.error)}</div>` : ''}
          <p style="font-size:12px">The secret stays in Orca's encrypted store on this computer. Google sends you back to <span class="mono">${esc(redirect)}</span>. If your company's admin blocks the sign-in, they can trust the client ID under Admin console → Security → API controls.</p>
          <div class="alt">
            ${mac ? `<button class="linkish" data-backend="eventkit">Use this Mac's calendars instead (no setup)</button>` : ''}
            <button class="linkish" data-backend="sample">Try it with a sample week</button>
          </div>
        </div>`
        if (kept.cid) $('cid').value = kept.cid
        if (kept.csecret) $('csecret').value = kept.csecret
      }

      async function startLogin() {
        // Read the fields before drawing again: drawing rebuilds them, and the secret is never drawn back.
        const typed = { clientId: $('cid').value, secret: $('csecret').value }
        login = { ...login, busy: true, error: null }
        renderConnect()
        try {
          const input = { clientId: typed.clientId }
          const secret = typed.secret
          if (secret) input.clientSecret = secret
          const { url } = await request('auth.start', input)
          login = { ...login, url, busy: false }
          auth = await request('auth.info').catch(() => auth)
        } catch (error) {
          login = { ...login, busy: false, error: error?.message || 'That didn’t work.' }
        }
        renderConnect()
      }

      function watchLogin() {
        clearInterval(login.polling)
        let tries = 0
        login.polling = setInterval(async () => {
          tries++
          const status = await request('auth.status').catch(() => ({ status: 'failed', message: 'Calendar stopped answering.' }))
          if (status.status === 'connected') {
            clearInterval(login.polling)
            login = { url: null, error: null, busy: false, polling: null }
            await load(true)
          } else if (status.status === 'failed' || tries > 90) {
            clearInterval(login.polling)
            login = { url: null, error: status.message || 'The login timed out.', busy: false, polling: null }
            render()
          }
        }, 2000)
      }

      // ---------- Mac access ----------
      function renderMacAccess() {
        main.innerHTML = `<div class="sheet"><div class="hero">${icon('lock', 40)}<h2>Read this Mac's calendars</h2><p>${esc(snap.message)}</p>
          <div class="actions" style="justify-content:center"><button class="btn primary" id="allow">Allow access</button></div>
          <p style="font-size:12px">Shows the accounts you added in System Settings → Internet Accounts: Google, Exchange, iCloud.</p></div>
          <div class="alt"><button class="linkish" data-backend="google">Connect Google Calendar instead</button><button class="linkish" data-backend="sample">Try it with a sample week</button></div></div>`
      }

      function renderMessage() {
        const title = { 'no-access': 'Calendar access is off', unsupported: 'Not available here', offline: 'Can’t reach your calendar', 'rate-limited': 'Taking a short break' }[snap.status] || 'Something went wrong'
        main.innerHTML = `<div class="sheet"><div class="hero">${icon('sheet', 40)}<h2>${esc(title)}</h2><p>${esc(snap.message || '')}</p>
          <div class="actions" style="justify-content:center"><button class="btn" id="retry">Try again</button></div></div>
          <div class="alt">${snap.backend !== 'google' ? '<button class="linkish" data-backend="google">Connect Google Calendar instead</button>' : ''}${snap.backend !== 'sample' ? '<button class="linkish" data-backend="sample">Try it with a sample week</button>' : ''}</div></div>`
      }

      // ---------- calendars sheet ----------
      function renderCalendars() {
        const groups = new Map()
        for (const c of snap.calendars || []) {
          if (!groups.has(c.account)) groups.set(c.account, [])
          groups.get(c.account).push(c)
        }
        const mac = auth?.platform === 'darwin' || navigator.platform.startsWith('Mac')
        const sources = [['google', 'Google'], ...(mac ? [['eventkit', 'Mac']] : []), ['sample', 'Sample']]
        const list = [...groups].map(([account, cals]) => `<div class="section-title">${esc(account || 'Calendars')}</div>` + cals.map((c) => `
            <label class="cal" style="--c:${safeColor(c.color)}"><input type="checkbox" data-cal="${esc(c.id)}"${c.shown ? ' checked' : ''} /><span class="box">${icon('check', 14)}</span><span class="t">${esc(c.title)}</span></label>`).join('')).join('')
        main.innerHTML = `<div class="sheet">
          <div class="section-title">Source</div>
          <div class="seg" role="group" aria-label="Calendar source">${sources.map(([id, label]) => `<button data-backend="${id}" aria-pressed="${snap.backend === id}">${label}</button>`).join('')}</div>
          ${list || '<p>No calendars to pick yet.</p>'}
          <div class="section-title">View</div>
          <div class="switch-row"><span>Days to show</span><select class="days" id="days">${[1, 2, 3, 5, 7, 14].map((n) => `<option value="${n}"${n === snap.days ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
          <label class="cal" style="--c:var(--today)"><input type="checkbox" id="declined"${snap.showDeclined ? ' checked' : ''} /><span class="box">${icon('check', 14)}</span><span class="t">Show declined events</span></label>
          ${snap.backend === 'google' && auth?.connected ? '<div class="alt"><button class="linkish" id="disconnect">Disconnect Google</button></div>' : ''}
          <div class="actions"><button class="btn primary" id="done">Done</button></div>
          <p style="font-size:12px">Reminders and the source are also in Orca Settings → Calendar.</p>
        </div>`
      }

      // ---------- events ----------
      document.addEventListener('click', (e) => {
        const target = e.target.closest('button, input, select')
        if (!target) return
        const joinId = target.dataset.join
        if (joinId) {
          const event = (snap.events || []).find((x) => x.id === joinId)
          // Checked again here: event text is untrusted, and only known meeting links open.
          if (event && openable(event.conference)) openUrl(event.conference.url)
          return
        }
        if (target.dataset.url) {
          const url = target.dataset.url
          if (/^https:\/\/(www\.google\.com\/calendar\/|calendar\.google\.com\/|console\.cloud\.google\.com\/)/.test(url)) openUrl(url)
          return
        }
        if (target.dataset.open) {
          const id = target.dataset.open
          open.has(id) ? open.delete(id) : open.add(id)
          return render()
        }
        if (target.dataset.backend) {
          view = 'agenda'
          login = { url: null, error: null, busy: false, polling: null }
          snap = null
          render()
          return void act('backend.select', { backend: target.dataset.backend }).then(() => (snap?.backend === 'google' ? request('auth.info').then((a) => ((auth = a), render())) : null))
        }
        if (target.dataset.answer) return void answer(target.dataset.event, target.dataset.calendar, target.dataset.answer)
        if (target.dataset.cal) return void act('calendars.set', { id: target.dataset.cal, shown: target.checked })
        switch (target.id) {
          case 'refresh':
            return void load(true)
          case 'settings':
            view = view === 'calendars' ? 'agenda' : 'calendars'
            if (view === 'calendars' && !auth) request('auth.info').then((a) => ((auth = a), render())).catch(() => {})
            return render()
          case 'done':
            view = 'agenda'
            return render()
          case 'declined':
            return void act('prefs.set', { key: 'showDeclined', value: target.checked })
          case 'continue':
            return void startLogin()
          case 'signin':
            openUrl(login.url)
            return watchLogin()
          case 'allow':
            snap = null
            renderLoading()
            return void act('eventkit.request')
          case 'reauth':
            return void request('auth.start', {})
              .then(({ url }) => ((login = { ...login, url, error: null }), render()))
              .catch((error) => ((login = { ...login, error: error?.message || 'That didn’t work.' }), render()))
          case 'retry':
            return void load(true)
          case 'disconnect':
            view = 'agenda'
            return void act('auth.disconnect').then(() => request('auth.info').then((a) => ((auth = a), render())))
        }
      })
      document.addEventListener('change', (e) => {
        if (e.target.id === 'days') act('prefs.set', { key: 'days', value: Number(e.target.value) })
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.target.id === 'cid' || e.target.id === 'csecret')) startLogin()
      })

      // Redraw at each whole minute for the now line and the countdown; the worker posts when the
      // calendar itself changed.
      function tick() {
        if (view === 'agenda' && snap?.status === 'ready' && !document.querySelector('input:focus')) render()
        setTimeout(tick, 60_000 - (Date.now() % 60_000) + 50)
      }
      setTimeout(tick, 60_000 - (Date.now() % 60_000) + 50)

      orca.plugin?.on?.('agenda.changed', () => {
        if (!busy) load()
      })
      orca.on?.('theme', () => render())
      renderLoading()
      load()
    </script>
  </body>
</html>
